session_name: nudge-free
start_directory: ./
windows:
  - window_name: grid
    layout: tiled
    panes:
      - shell_command: "aider:gemini"
        nudge:
          title: aider gemini
          agent: aider
          monitor: true
          tasks:
          babysit:
            enabled: false
            interval_secs: 1800
            clear_every: 6

      - shell_command: "aider:groq"
        nudge:
          title: aider groq
          agent: aider
          monitor: true
          tasks:
          babysit:
            enabled: false
            interval_secs: 1800
            clear_every: 6
