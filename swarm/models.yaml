# Optional shell_command aliases. A swarm YAML value expands only when the
# entire shell_command is one of these keys. Any other string is launched
# as written. Model ids and launch flags live here.
#
# Only commands that were already in swarm configs. No guessed flags.

"codex:heavy": codex --dangerously-bypass-approvals-and-sandbox -m gpt-6-sol
"codex:medium": codex --dangerously-bypass-approvals-and-sandbox -m gpt-6-luna -c model_reasoning_effort=medium
"codex:light": codex --dangerously-bypass-approvals-and-sandbox -m gpt-6-luna -c model_reasoning_effort=low

"claude:heavy": claude --dangerously-skip-permissions
# ultralight = genuinely weak, not just cheap. Keep it out of the `light` pool.
"claude:ultralight": claude --dangerously-skip-permissions --model haiku
# Deprecated alias for claude:ultralight, kept for configs that still name it.
"claude:light": claude --dangerously-skip-permissions --model haiku

# No -m. grok models does not list grok-build. The CLI default is the model in use.
"grok:heavy": grok --always-approve

"antigravity:heavy": agy --dangerously-skip-permissions --model gemini-3.8-flash-high
"antigravity:medium": agy --dangerously-skip-permissions --model gemini-3.8-flash-medium
"antigravity:light": agy --dangerously-skip-permissions --model gemini-3.8-flash-low

# aider = BYO-key models (see docs/models.md). Keys come from ~/.cred/ai.sh via --env-file.
# Model ids are litellm names; groq/* verified with aider --list-models, others unverified.
"aider:gemini": aider --env-file ~/.cred/ai.sh --yes-always --no-auto-commits --no-gitignore --model gemini/gemini-3.8-flash
"aider:gemini-pro": aider --env-file ~/.cred/ai.sh --yes-always --no-auto-commits --no-gitignore --model gemini/gemini-3.1-pro-preview
"aider:groq": aider --env-file ~/.cred/ai.sh --yes-always --no-auto-commits --no-gitignore --map-tokens 0 --model groq/qwen/qwen3.8-27b
"aider:groq-oss": aider --env-file ~/.cred/ai.sh --yes-always --no-auto-commits --no-gitignore --map-tokens 0 --model groq/openai/gpt-oss-120b
"aider:codestral": aider --env-file ~/.cred/ai.sh --yes-always --no-auto-commits --no-gitignore --model mistral/codestral-latest
"aider:mistral-code": aider --env-file ~/.cred/ai.sh --yes-always --no-auto-commits --no-gitignore --model mistral/mistral-code-latest
"aider:cohere": aider --env-file ~/.cred/ai.sh --yes-always --no-auto-commits --no-gitignore --model openrouter/cohere/north-mini-code:free
"aider:nemotron": aider --env-file ~/.cred/ai.sh --yes-always --no-auto-commits --no-gitignore --model openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
