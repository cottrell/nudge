session_name: nudge
windows:
  - window_name: grid
    layout: tiled
    panes:
      - shell_command: "codex:heavy"
        nudge:
          title: codex heavy
          agent: codex
          monitor: true
          tasks:
            # no enabled: false = allowed to take tasks when dispatcher runs
          babysit:
            enabled: false
            interval_secs: 7200
            clear_every: 1
            long_prompt_file: prompts/worker_long.md
            short_prompt_file: prompts/worker_short.txt
      - shell_command: "codex:light"
        nudge:
          title: codex light
          agent: codex
          monitor: true
          tasks:
            # no enabled: false = allowed to take tasks when dispatcher runs
          babysit:
            enabled: false
            interval_secs: 1800
            clear_every: 6
            long_prompt_file: prompts/worker_long.md
            short_prompt_file: prompts/worker_short.txt
